<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
<title id="title">Five fictional airline personas</title><desc id="desc">Doris the gate agent, a travel agent, call-center representative, frequent flyer, and operations manager.</desc>
<rect width="1000" height="245" fill="#008080"/><g font-family="Arial,sans-serif" fill="#171717">
<g transform="translate(15 15)"><rect width="185" height="215" fill="#c0c0c0" stroke="#fff" stroke-width="3"/><rect width="185" height="28" fill="#000080"/><text x="8" y="19" fill="white" font-weight="bold">DORIS · GATE AGENT</text><text x="10" y="62">Needs fast rebooking</text><text x="10" y="84">for a long queue.</text><text x="10" y="133">Pain: 14-step</text><text x="10" y="155">workaround.</text></g>
<g transform="translate(211 15)"><rect width="185" height="215" fill="#c0c0c0" stroke="#fff" stroke-width="3"/><rect width="185" height="28" fill="#000080"/><text x="8" y="19" fill="white" font-weight="bold">TRAVEL AGENT</text><text x="10" y="62">Needs dependable</text><text x="10" y="84">availability and fares.</text><text x="10" y="133">Pain: stale holds.</text></g>
<g transform="translate(407 15)"><rect width="185" height="215" fill="#c0c0c0" stroke="#fff" stroke-width="3"/><rect width="185" height="28" fill="#000080"/><text x="8" y="19" fill="white" font-weight="bold">CALL-CENTER REP</text><text x="10" y="62">Needs a clear</text><text x="10" y="84">passenger history.</text><text x="10" y="133">Pain: many screens.</text></g>
<g transform="translate(603 15)"><rect width="185" height="215" fill="#c0c0c0" stroke="#fff" stroke-width="3"/><rect width="185" height="28" fill="#000080"/><text x="8" y="19" fill="white" font-weight="bold">FREQUENT FLYER</text><text x="10" y="62">Needs a reliable seat</text><text x="10" y="84">and transparent fare.</text><text x="10" y="133">Pain: surprises.</text></g>
<g transform="translate(799 15)"><rect width="185" height="215" fill="#c0c0c0" stroke="#fff" stroke-width="3"/><rect width="185" height="28" fill="#000080"/><text x="8" y="19" fill="white" font-weight="bold">OPS MANAGER</text><text x="10" y="62">Needs safe departures</text><text x="10" y="84">and incident evidence.</text><text x="10" y="133">Pain: duplicate seats.</text></g></g></svg>
