services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eagledesk
      POSTGRES_USER: eagledesk
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - ../app/db/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ../app/db/002-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagledesk"]
      interval: 5s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile
    environment:
      ConnectionStrings__EagleDesk: "Host=db;Database=eagledesk;Username=eagledesk;Password=local-demo-only"
    volumes:
      - ..:/workspace
    depends_on:
      db:
        condition: service_healthy
  webforms:
    build:
      context: ..
      dockerfile: app/webforms/Dockerfile
    environment:
      EAGLEDESK_DB: "Host=db;Database=eagledesk;Username=eagledesk;Password=local-demo-only"
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../app/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, webforms]
