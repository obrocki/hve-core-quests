name: generated-playground-composition
description: Offline program graders for local composition evidence. Prompts are labels, not evidence.
type: capability
defaults:
  executor: mock
  runs: 1
stimuli:
  - name: generated-structural-readiness
    supported_executors: &offline [mock]
    prompt: Inspect the local output for its required workshop structure and procedural suite.
    graders:
      - type: program
        name: generated-readiness
        config:
          program: node
          timeout: 3m
          args:
            - -e
            - &dispatch >-
              const checker = process.env.HVE_QUEST_AUTHOR_CHECKER;
              if (!checker || !require("node:path").isAbsolute(checker)) throw new Error("Trusted local checker path required.");
              const result = require("node:child_process").spawnSync(process.execPath, [checker, "grade", ...process.argv.slice(1)], {stdio: "inherit"});
              if (result.error) throw result.error;
              process.exitCode = result.status ?? 1;
            - composition
            - readiness
  - name: generated-pack-integrity
    supported_executors: *offline
    prompt: Compare the installed checkers and license to their bundled originals.
    graders:
      - type: program
        name: generated-pack-byte-identity
        config:
          program: node
          args: [-e, *dispatch, composition, pack-integrity]
  - name: generated-quest-briefs
    supported_executors: *offline
    prompt: Verify each numbered quest has its own nonempty local brief.
    graders:
      - type: program
        name: generated-numbered-briefs
        config:
          program: node
          args: [-e, *dispatch, composition, quest-briefs]
  - name: generated-png-container
    supported_executors: *offline
    prompt: Check the expected local capture for an intact PNG container without interpreting its pixels.
    graders:
      - type: program
        name: generated-capture-markers
        config:
          program: node
          args: [-e, *dispatch, composition, capture-container]
  - name: generated-procedural-contract
    supported_executors: *offline
    prompt: Validate the generated twelve-quest procedural spec without loading or executing an agent.
    graders:
      - type: program
        name: generated-static-procedural-suite
        config:
          program: node
          args: [-e, *dispatch, composition, procedural-suite]
  - name: generated-three-tier-wiring
    supported_executors: *offline
    prompt: Find a connected local resource path from the frontend to logic to storage.
    graders:
      - type: program
        name: generated-local-tier-chain
        config:
          program: node
          args: [-e, *dispatch, composition, tier-wiring]
  - name: generated-offline-startup
    supported_executors: *offline
    prompt: Observe startup of the file URL in a fresh offline browser context.
    graders:
      - type: program
        name: generated-browser-startup
        config:
          program: node
          timeout: 90s
          args: [-e, *dispatch, composition, offline-startup]
  - name: generated-dependency-evidence
    supported_executors: *offline
    prompt: Audit declarations and resolved lock entries for open license evidence.
    graders:
      - type: program
        name: generated-locked-license-evidence
        config:
          program: node
          args: [-e, *dispatch, composition, dependency-evidence]
  - name: generated-clue-discovery
    supported_executors: *offline
    prompt: Validate the marker manifest and run the trusted flag checker for each quest.
    graders:
      - type: program
        name: generated-twelve-discovery-checks
        config:
          program: node
          timeout: 3m
          args: [-e, *dispatch, composition, clue-discovery]
  - name: generated-unseeded-inventory
    supported_executors: *offline
    prompt: Review local declaration and scope coverage without asserting clearance or origin.
    graders:
      - type: program
        name: generated-unseeded-origin-coverage
        config:
          program: node
          args: [-e, *dispatch, composition, unseeded-inventory]
