name: eagledesk-quests
description: Response-only smoke probes for twelve quest-relevant observations. These do not constitute full quest completion.
type: capability
defaults:
  runs: 1
  timeout: 180s
  executor: copilot-sdk
scoring:
  threshold: 1.0
stimuli:
  - name: quest-01-documentation-drift
    prompt: "Read the staged migration memo. Identify the historical claim that needs verification and distinguish archived from current code."
    agent_environment:
      files:
        - src: ../../docs/lore/migration-memo.md
          dest: evidence/migration-memo.md
    graders:
      - type: output-matches
        name: serialization-claim
        config: { pattern: '(?i)(serializ|lock)' }
      - type: output-matches
        name: archive-distinction
        config: { pattern: '(?i)(archive|source.only|historical)' }
  - name: quest-02-seat-trace
    prompt: "Read the staged API source. What database function handles a seat hold?"
    agent_environment:
      files:
        - src: ../../app/api/Program.cs
          dest: evidence/Program.cs
    graders:
      - type: output-matches
        name: hold-function
        config: { pattern: '(?i)hold_seat' }
  - name: quest-03-empathy
    prompt: "Read the staged shift memo and describe Doris's operational need and why the scenario should be validated."
    agent_environment:
      files:
        - src: ../../docs/lore/shift-memo.md
          dest: evidence/shift-memo.md
    graders:
      - type: output-matches
        name: rebooking
        config: { pattern: '(?i)(rebook|fourteen|14.step)' }
      - type: output-matches
        name: evidence-limit
        config: { pattern: '(?i)(fictional|validat|assumption|synthetic)' }
  - name: quest-04-meeting
    prompt: "Read the staged fictional transcript. Identify a requirement and a significant unknown for the fare feature."
    agent_environment:
      files:
        - src: ../../docs/lore/ceo-meeting.md
          dest: evidence/ceo-meeting.md
    graders:
      - type: output-matches
        name: uncertainty
        config: { pattern: '(?i)(no trained model|no.*data|unknown|lack|not.*model)' }
  - name: quest-05-backlog
    prompt: "Read the staged ticket ledger. Identify the incident that should be triaged and explain a reason."
    agent_environment:
      files:
        - src: ../../docs/lore/backlog.md
          dest: evidence/backlog.md
    graders:
      - type: output-matches
        name: incident
        config: { pattern: '(?i)(14C|B-01)' }
  - name: quest-06-architecture
    prompt: "Read the staged migration memo. Explain one coupling or migration risk and distinguish the archive from runnable layers."
    agent_environment:
      files:
        - src: ../../docs/lore/migration-memo.md
          dest: evidence/migration-memo.md
    graders:
      - type: output-matches
        name: migration
        config: { pattern: '(?i)(migrat|database|postgres)' }
      - type: output-matches
        name: archived
        config: { pattern: '(?i)(archive|source.only|not.*run)' }
  - name: quest-07-race
    prompt: "Read the staged SQL. Explain the specific 14C concurrency defect and the missing serialization."
    agent_environment:
      files:
        - src: ../../app/db/001-schema.sql
          dest: evidence/schema.sql
    graders:
      - type: output-matches
        name: exceptional-seat
        config: { pattern: '(?i)14C' }
      - type: output-matches
        name: locking
        config: { pattern: '(?i)(lock|serializ)' }
  - name: quest-08-security
    prompt: "Read the staged security memo. Distinguish the archived query issue from the running surface."
    agent_environment:
      files:
        - src: ../../docs/lore/security-memo.md
          dest: evidence/security-memo.md
    graders:
      - type: output-matches
        name: concatenation
        config: { pattern: '(?i)(concatenat|injection)' }
      - type: output-matches
        name: archive-scope
        config: { pattern: '(?i)(not.*running|archive|source.only)' }
  - name: quest-09-dependencies
    prompt: "Read the staged WebForms Dockerfile. Identify the pinned database dependency and a supply-chain follow-up."
    agent_environment:
      files:
        - src: ../../app/webforms/Dockerfile
          dest: evidence/Dockerfile
    graders:
      - type: output-matches
        name: package
        config: { pattern: '(?i)Npgsql' }
      - type: output-matches
        name: follow-up
        config: { pattern: '(?i)(version|license|provenance|update|audit|vulnerab)' }
  - name: quest-10-privacy
    prompt: "Read the staged SQL. Identify a sensitive data field and recommend a proportionate privacy control."
    agent_environment:
      files:
        - src: ../../app/db/001-schema.sql
          dest: evidence/schema.sql
    graders:
      - type: output-matches
        name: passport
        config: { pattern: '(?i)passport' }
      - type: output-matches
        name: control
        config: { pattern: '(?i)(minimi|retention|encrypt|access|remov)' }
  - name: quest-11-responsible-ai
    prompt: "Read the staged API. Explain how the fare endpoint works and whether it is a trained model."
    agent_environment:
      files:
        - src: ../../app/api/Program.cs
          dest: evidence/Program.cs
    graders:
      - type: output-matches
        name: random
        config: { pattern: '(?i)random' }
      - type: output-matches
        name: not-trained
        config: { pattern: '(?i)(not|no|isn.t).{0,35}(trained|model)' }
  - name: quest-12-regression
    prompt: "Read the staged SQL. Propose a concurrent test for the 14C race and a locking fix."
    agent_environment:
      files:
        - src: ../../app/db/001-schema.sql
          dest: evidence/schema.sql
    graders:
      - type: output-matches
        name: concurrent
        config: { pattern: '(?i)(concurr|simultaneous|parallel|two transactions)' }
      - type: output-matches
        name: serialize
        config: { pattern: '(?i)(lock|serializ)' }
