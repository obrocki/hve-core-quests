name: workshop-instructions
description: Twelve procedural cases for static lint. No evidence files are staged and live execution is not supported.
type: capability
defaults:
  runs: 1
scoring:
  threshold: 1.0
stimuli:
  - name: quest-01-documentation
    prompt: "What should a launch note say about the requirements of an offline frontend?"
    graders:
      - type: output-matches
        name: offline-boundary
        config: { pattern: '(?i)(local|offline)' }
  - name: quest-02-research
    prompt: "How should a research plan distinguish something observed from a claim not yet checked?"
    graders:
      - type: output-matches
        name: evidence-boundary
        config: { pattern: '(?i)(evidence|observation|assumption)' }
  - name: quest-03-design
    prompt: "How should a design exercise label an invented perspective rather than present it as user research?"
    graders:
      - type: output-matches
        name: design-limitation
        config: { pattern: '(?i)(invented|fictional|assumption|hypothesis)' }
  - name: quest-04-requirements
    prompt: "What makes a requirement testable before implementation starts?"
    graders:
      - type: output-matches
        name: observable-outcome
        config: { pattern: '(?i)(observable|acceptance|measure)' }
  - name: quest-05-backlog
    prompt: "How should dependencies affect the order of work on a backlog?"
    graders:
      - type: output-matches
        name: ordering
        config: { pattern: '(?i)(dependenc|prerequisite|block)' }
  - name: quest-06-architecture
    prompt: "What belongs in an architecture decision record besides the chosen option?"
    graders:
      - type: output-matches
        name: alternatives
        config: { pattern: '(?i)(alternative|trade.off|consequence)' }
  - name: quest-07-root-cause
    prompt: "How would an investigation distinguish a symptom from evidence of its cause?"
    graders:
      - type: output-matches
        name: causal-evidence
        config: { pattern: '(?i)(hypothesis|test|evidence)' }
  - name: quest-08-security
    prompt: "What should a threat review establish before recommending a control?"
    graders:
      - type: output-matches
        name: threat-scope
        config: { pattern: '(?i)(boundary|asset|threat|risk)' }
  - name: quest-09-supply-chain
    prompt: "Which facts would you check about a dependency before recommending its use?"
    graders:
      - type: output-matches
        name: provenance
        config: { pattern: '(?i)(origin|provenance|license|maintainer)' }
  - name: quest-10-inclusion
    prompt: "Name a check for keyboard access and a separate check for data minimization."
    graders:
      - type: output-matches
        name: access
        config: { pattern: '(?i)(keyboard|focus|tab)' }
      - type: output-matches
        name: minimization
        config: { pattern: '(?i)(minimi|necessary|retention|collect)' }
  - name: quest-11-responsible-ai
    prompt: "What makes a proposed experiment measurable, and what would justify stopping it?"
    graders:
      - type: output-matches
        name: experiment-boundary
        config: { pattern: '(?i)(metric|threshold|baseline|measure)' }
  - name: quest-12-delivery
    prompt: "What should a handoff say about the change, its evidence and checks that did not run?"
    graders:
      - type: output-matches
        name: limitations
        config: { pattern: '(?i)(limitation|unverified|not run|not tested)' }
